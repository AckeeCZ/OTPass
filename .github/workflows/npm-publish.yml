# This workflow will publish a package to NPM when a release is created, see more details at https://docs.npmjs.com/trusted-publishers
name: Publish to NPM

on:
  release:
    types: [created]

permissions:
  id-token: write

jobs:
  test:
    strategy:
      matrix:
        version: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm i --ignore-scripts
      - run: npm test

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: npm i --ignore-scripts
      - run: npm run build
      - run: mv dist/* ./ 
      - run: npm publish --access public --provenance
